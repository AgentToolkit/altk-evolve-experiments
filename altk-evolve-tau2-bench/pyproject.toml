[project]
name = "react-eval-tau2"
version = "0.1.0"
description = "Evaluate tau2-bench's native ReAct agent on tau2-bench (full-conversational), with playbook-JSON guideline injection."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
    "pydantic",
    "loguru",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# Force the resolver to pick versions with wheels for our supported targets.
# Without this, uv's universal resolution can pick versions whose wheel coverage
# has gaps on one platform.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
tau2 = { path = "../tau2-bench", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]
